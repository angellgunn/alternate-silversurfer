image: andthensome/alpine-hugo-git-bash

pipelines:
  # Master branch deployment to live - no drafts
  branches:
    master:
      - step:
          script:
            - git submodule update
            - apk update
            - apk add openssh
            - apk add git
            - hugo
            - git config user.name 'fhcflx'
            - git config user.email 'fhcflx@outlook.com'
            - git add .
            - git commit -m 'new update'
            - git subtree split --branch deploy --prefix public/
            - git checkout deploy
            - git push -u origin deploy