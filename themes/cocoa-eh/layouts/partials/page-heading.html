<div class="page-heading">
{{ if .Params.heading }}
    {{ .Params.heading }}
{{ else }}
    {{ .Title }}
{{ end }}
<small>
<i> por </i>
{{ if isset .Params "author" }}
    {{ $author := index .Site.Data.authors .Params.author }}
    {{ $author.name }}
{{ else }}
    Unknown
{{ end }}
</small>
</div>
