image: andthensome/alpine-hugo-git-bash

pipelines:
  # Master branch deployment to live - no drafts
  branches:
    master:
      - step:
          script:
            - git submodule update
            - hugo
            - git config user.name 'fhcflx'
            - git config user.mail fhcflx@outlook.com
            - git add . && git commit --author='fhcflx<fhcflx@outlook.com>' -m "new update" && git push
            - git filter-branch --subdirectory-filter public --state-branch deploy