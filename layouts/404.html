<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Page not found</title>
    {{ partial "head_includes.html" . }}
    <style>
        {{ partial "css/404.css" . | safeCSS }}
    </style>
</head>
<body>
    {{ with .Site.Params.logofile }}
    <a href="{{ $.Site.Home.RelPermalink }}" aria-label="{{ $.Site.Title }}">
        <img src="{{ . | relURL }}" class="logo" alt="">
    </a>
    {{ end }}
    <main class="container f04">
        <div class="content">
            <header class="header">
                <h1 class="name">404</h1>
            </header>
            <div class="detail">The page you were looking for does not exist.</div>
            <div class="suggestion"><a href="{{ .Site.Home.RelPermalink }}">Visit the home page</a></div>
        </div>
    </main>
</body>
</html>
