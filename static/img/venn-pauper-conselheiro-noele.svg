<svg viewBox="0 0 720 680" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <title>Diagrama de Venn temático: Pauper, Conselheiro e Noele</title>
  <desc>Comparação de temas dos posts originais de Pauper (X, 125), Conselheiro (Threads, 67) e Noele (X, 93), mostrando temas compartilhados pelos três, por pares, e exclusivos.</desc>

  <rect x="0" y="0" width="720" height="680" fill="#FFFFFF"/>

  <circle cx="290" cy="230" r="175" fill="#F0997B" fill-opacity="0.20" stroke="#993C1D" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="460" cy="230" r="140" fill="#5DCAA5" fill-opacity="0.18" stroke="#0F6E56" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="375" cy="410" r="155" fill="#B48EAD" fill-opacity="0.20" stroke="#6B3466" stroke-opacity="0.55" stroke-width="1.5"/>

  <text x="145" y="95" text-anchor="middle" font-size="20" font-weight="bold" fill="#993C1D">Pauper</text>
  <text x="145" y="115" text-anchor="middle" font-size="13" fill="#444444">125 posts (X)</text>

  <text x="595" y="95" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F6E56">Conselheiro</text>
  <text x="595" y="115" text-anchor="middle" font-size="13" fill="#444444">67 posts (Threads)</text>

  <text x="375" y="628" text-anchor="middle" font-size="20" font-weight="bold" fill="#6B3466">Noele</text>
  <text x="375" y="648" text-anchor="middle" font-size="13" fill="#444444">93 posts (X)</text>

  <!-- Pauper exclusivo -->
  <g>
    <rect x="60" y="222" width="160" height="52" rx="10" fill="#FBE2D6" stroke="#993C1D" stroke-width="1"/>
    <text x="140" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A2712">Cripto/web3</text>
    <text x="140" y="260" text-anchor="middle" font-size="12" fill="#6A2712">10% · 0% · 0%</text>
  </g>
  <g>
    <rect x="60" y="282" width="160" height="52" rx="10" fill="#FBE2D6" stroke="#993C1D" stroke-width="1"/>
    <text x="140" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A2712">Cultura pop</text>
    <text x="140" y="320" text-anchor="middle" font-size="12" fill="#6A2712">6% · 2% · 0%</text>
  </g>

  <!-- Conselheiro exclusivo -->
  <g>
    <rect x="500" y="255" width="170" height="52" rx="10" fill="#D9F0E7" stroke="#0F6E56" stroke-width="1"/>
    <text x="585" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#0A4A3A">Religião/filosofia</text>
    <text x="585" y="293" text-anchor="middle" font-size="12" fill="#0A4A3A">3% · 15% · 0%</text>
  </g>

  <!-- Noele exclusivo -->
  <g>
    <rect x="300" y="520" width="150" height="52" rx="10" fill="#F1E2EE" stroke="#6B3466" stroke-width="1"/>
    <text x="375" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A2248">Medicina/saúde</text>
    <text x="375" y="558" text-anchor="middle" font-size="12" fill="#4A2248">0% · 3% · 17%</text>
  </g>

  <!-- Pauper x Conselheiro -->
  <g>
    <rect x="305" y="140" width="150" height="52" rx="10" fill="#EDE4F7" stroke="#6B3FA0" stroke-width="1"/>
    <text x="380" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#3D2360">Política BR</text>
    <text x="380" y="178" text-anchor="middle" font-size="12" fill="#3D2360">11% · 9% · 1%</text>
  </g>

  <!-- Pauper x Noele -->
  <g>
    <rect x="150" y="360" width="160" height="52" rx="10" fill="#EDE4F7" stroke="#6B3FA0" stroke-width="1"/>
    <text x="230" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#3D2360">Sobre o X</text>
    <text x="230" y="398" text-anchor="middle" font-size="12" fill="#3D2360">6% · 2% · 8%</text>
  </g>

  <!-- Conselheiro x Noele -->
  <g>
    <rect x="460" y="360" width="160" height="52" rx="10" fill="#EDE4F7" stroke="#6B3FA0" stroke-width="1"/>
    <text x="540" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#3D2360">Crítica social</text>
    <text x="540" y="398" text-anchor="middle" font-size="12" fill="#3D2360">0% · 5% · 3%</text>
  </g>

  <!-- Zona compartilhada pelos três -->
  <g>
    <rect x="303" y="222" width="144" height="48" rx="10" fill="#FFF3D6" stroke="#B08900" stroke-width="1"/>
    <text x="375" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B5300">Ciência/Matemática</text>
    <text x="375" y="257" text-anchor="middle" font-size="11" fill="#6B5300">8% · 9% · 3%</text>
  </g>
  <g>
    <rect x="303" y="276" width="144" height="48" rx="10" fill="#FFF3D6" stroke="#B08900" stroke-width="1"/>
    <text x="375" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B5300">Heteronímia</text>
    <text x="375" y="311" text-anchor="middle" font-size="11" fill="#6B5300">2% · 21% · 9%</text>
  </g>
  <g>
    <rect x="303" y="330" width="144" height="48" rx="10" fill="#FFF3D6" stroke="#B08900" stroke-width="1"/>
    <text x="375" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B5300">IA/tecnologia</text>
    <text x="375" y="365" text-anchor="middle" font-size="11" fill="#6B5300">4% · 5% · 11%</text>
  </g>

  <text x="140" y="465" text-anchor="middle" font-size="11" fill="#888888" font-style="italic">exclusivo (relativo)</text>
  <text x="585" y="465" text-anchor="middle" font-size="11" fill="#888888" font-style="italic">exclusivo (relativo)</text>

  <text x="360" y="670" text-anchor="middle" font-size="11" fill="#999999">Percentuais na ordem: Pauper · Conselheiro · Noele. Fonte: arquivos de dados do X/Threads, posts originais, jul. 2026.</text>
</svg>
