<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>401 — Não autorizado</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f8f6ef;
        --ink: #1f2a3a;
        --muted: #5f6b7a;
        --accent: #6f8fb8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(255,255,255,0.9), rgba(248,246,239,0.85)),
          url("/img/logo.png") center/cover no-repeat;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .card {
        max-width: 720px;
        width: 100%;
        padding: 2.5rem;
        border-radius: 24px;
        background: rgba(255,255,255,0.84);
        backdrop-filter: blur(8px);
        box-shadow: 0 20px 50px rgba(31, 42, 58, 0.12);
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: rgba(111, 143, 184, 0.16);
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.8rem;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: clamp(2rem, 3vw, 3rem);
        margin: 0 0 0.75rem;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
        margin: 0 0 1.5rem;
      }

      a {
        display: inline-block;
        text-decoration: none;
        color: white;
        background: var(--ink);
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        font-weight: 600;
      }

      a:hover {
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">401 Unauthorized</div>
      <h1>Você não tem autorização para entrar aqui.</h1>
      <p>Esta página foi reservada para indicar que o acesso a este conteúdo não está disponível no momento.</p>
      <a href="/">Voltar para a página inicial</a>
    </main>
  </body>
</html>
