<div class="page-heading">
{{ if .Params.heading }}
    {{ .Params.heading }}
{{ else }}
    {{ .Title }}
{{ end }}

<span> - </span>

    {{ $author := index .Site.Data.authors .Params.author }}

{{ else }}
    Unown
{{ end }}

</div>
