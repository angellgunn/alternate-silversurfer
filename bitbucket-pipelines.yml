image: andthensome/alpine-hugo-surge-git-bash

pipelines:
  # Master branch deployment to live - no drafts
  branches:
    master:
      - step:
          script:
            - apk update
            - apk add openssh
            - git submodule update
            - hugo
            - git config user.name 'silversurfer'
            - git config user.email 'alternate-silversurfer@outlook.com'
            - git add . && git commit -m 'new update'
            - git filter-branch --prune-empty --subdirectory-filter public
            - git checkout -b deploy
            - git push -f origin deploy