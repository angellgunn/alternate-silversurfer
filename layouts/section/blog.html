{{ partial "header.html" . }}
<main class="site-main">
    <section class="main">
        <div class="container">
            <div class="content">
                <div class="posts">
                    <h1 class="page-heading">Blog</h1>
                    <ul>
                        {{ range .Data.Pages.GroupByDate "Jan, 2006" "desc" }}
                            <li class="groupby">{{ .Key }}</li>
                            {{ range .Pages.ByDate.Reverse }}
                                {{ partial "li.html" . }}
                            {{ end }}
                        {{ end }}
                    </ul>
                </div>
            </div>
        </div>
    </section>
</main>
{{ partial "footer.html" . }}
