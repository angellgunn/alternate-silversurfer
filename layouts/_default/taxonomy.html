{{ partial "header.html" . }}
<main class="site-main">
    <section class="main">
        <div class="container">
            <div class="content">
                <div class="posts">
                    <h1 class="page-heading">Posts about {{ .Title }}</h1>
                    <ul>
                        {{ range .Data.Pages.ByDate.Reverse }}
                            {{ partial "li.html" . }}
                        {{ end }}
                    </ul>
                </div>
            </div>
        </div>
    </section>
</main>
{{ partial "footer.html" . }}
